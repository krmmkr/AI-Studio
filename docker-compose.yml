version: '3.8'

services:
  cockpit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity_cockpit
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      # By default, uses local SQLite database mounted in ./local_data
      # To switch to Postgres, uncomment the line below and the postgres service below:
      # - DATABASE_URL=postgresql+psycopg2://cockpit_admin:cockpit_secure_password@postgres:5432/cockpit_prod
      - DATABASE_URL=sqlite:///app/local_data/cockpit.db
      - JWT_SECRET=production-antigravity-secret-key-change-in-production-deployments
      - CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      - LLM_PROVIDER=antigravity
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./local_data:/app/local_data
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  # Optional PostgreSQL service for production-identical testing
  postgres:
    image: postgres:16-alpine
    container_name: antigravity_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cockpit_prod
      POSTGRES_USER: cockpit_admin
      POSTGRES_PASSWORD: cockpit_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit_admin -d cockpit_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

volumes:
  postgres_data:
