version: '3.8'

services:
  cockpit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity_cockpit
    restart: unless-stopped
    ports:
      - "8000:8000"
      # Sandbox preview port range forwarded for external testing across repos/worktrees:
      - "${SANDBOX_PORT_RANGE:-10000-10100}:${SANDBOX_PORT_RANGE:-10000-10100}"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - SANDBOX_PORT_START=${SANDBOX_PORT_START:-10000}
      - SANDBOX_PORT_END=${SANDBOX_PORT_END:-10100}
      - SANDBOX_PUBLIC_HOST=${SANDBOX_PUBLIC_HOST:-localhost}
      # By default, uses local SQLite database mounted in ./local_data
      # Note: Absolute paths in SQLite connection strings require 4 slashes: sqlite:////app/...
      # To switch to Postgres, uncomment the line below and the postgres service below:
      # - DATABASE_URL=postgresql+psycopg2://cockpit_admin:cockpit_secure_password@postgres:5432/cockpit_prod
      - DATABASE_URL=sqlite:////app/local_data/cockpit.db
      - JWT_SECRET=${JWT_SECRET:-production-antigravity-secret-key-change-in-production-deployments}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - LLM_PROVIDER=${LLM_PROVIDER:-antigravity}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTIGRAVITY_API_KEY=${ANTIGRAVITY_API_KEY:-}
      - ANTIGRAVITY_BASE_URL=${ANTIGRAVITY_BASE_URL:-}
      - ANTIGRAVITY_MODEL=${ANTIGRAVITY_MODEL:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_HOST=${GITHUB_HOST:-}
    volumes:
      - ./local_data:/app/local_data
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  # Optional PostgreSQL service for production-identical testing
  postgres:
    image: postgres:16-alpine
    container_name: antigravity_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cockpit_prod
      POSTGRES_USER: cockpit_admin
      POSTGRES_PASSWORD: cockpit_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit_admin -d cockpit_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

volumes:
  postgres_data:
